name: ESP-IDF 编译
run-name: 编译 ESP32-S3 语音灯固件

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v3

      - name: 安装系统依赖
        run: |
          apt-get update
          apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: 安装 ESP-IDF v5.3
        run: |
          git clone -b v5.3 --recursive https://gitee.com/EspressifSystems/esp-idf.git
          cd esp-idf
          ./install.sh esp32s3

      - name: 编译固件
        run: |
          . ./esp-idf/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: 上传编译产物
        uses: actions/upload-artifact@v3
        with:
          name: esp32s3-sr-light-bin
          path: |
            build/bootloader.bin
            build/partition-table.bin
            build/*.bin
